<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loy's MD2BSP Tool</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="https://pyscript.net/releases/2025.10.3/core.js"></script>
</head>
<body>
  <header class="top-bar">
    <span class="site-name">Loy's Markdown to Brightspace</span>
  </header>
  <div class="nav-bar">Step 1: Paste your content</div>

  <main>
    <h1>New Page</h1>

    <form>
      <div class="columns">

        <section class="card">
          <h2>Paste your markdown</h2>
          <label for="markdown-input">Markdown content</label>
          <textarea id="markdown-input"></textarea>
          <p id="result" aria-live="polite"></p>
          <p id="status" class="status">Waiting for Python...</p>
        </section>

        <aside class="card">
          <h2>How this works</h2>
          <ol>
            <li>Paste your markdown into the box.</li>
            <li>Click <strong>Chunk it</strong>.</li>
            <li>The tool splits your text into parts and shows what it found.</li>
          </ol>
        </aside>

      </div>

      <div class="action-bar">
        <button type="button" id="go-button" class="primary" disabled>Chunk it</button>
        <button type="reset" class="secondary">Clear</button>
      </div>
    </form>
  </main>

  <script type="py" src="./main.py"></script>
</body>
</html>
