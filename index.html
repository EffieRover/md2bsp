<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loy's MD2BSP Tool</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="https://pyscript.net/releases/2025.10.3/core.js"></script>
</head>
<body>
  <header class="top-bar">
    <span class="site-name">Loy's Markdown to Brightspace</span>
  </header>
<nav class="nav-bar" aria-label="Steps">
  <ol class="steps">
    <li aria-current="step">1: Paste</li>
    <li>2: Organize</li>
  </ol>
</nav>

  <main>
    <h1>New Page</h1>

    <form>
      <div class="columns">
      <div>
        <section class="card">
          <label for="markdown-input" class="visually-hidden">Markdown content</label>
          <textarea id="markdown-input" placeholder="Paste your markdown here"></textarea>
          <p id="result" aria-live="polite"></p>
          <p id="status" class="status">Waiting for Python...</p>
        </section>

        <div id="boxes"></div>
      </div>
        
        <aside class="card">
          <h2>How this works</h2>
          <ol>
            <li>Paste your markdown into the box.</li>
            <li>Click <strong>Chunk it</strong>.</li>
            <li>The tool splits your text into parts and shows what it found.</li>
          </ol>
        </aside>

      </div>

      <div class="action-bar">
        <button type="button" id="go-button" class="primary" disabled>Chunk it</button>
        <button type="reset" id="clear-button" class="secondary">Clear</button>
      </div>
    </form>
  </main>

  <script type="py" src="./main.py" config="./pyscript.toml"></script>
</body>
</html>
